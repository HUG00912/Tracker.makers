<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<title>makers. — Producción</title>

<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('inter.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

:root{
  --blue:#2540D8; --blue-d:#1B31AC; --blue-soft:#E4E8FC; --blue-line:#C3CCF7;
  --lime:#DCF43A; --lime-soft:#F4FBC4;
  --navy:#0E1440; --navy2:#1C2456; --navy3:#2C3363;
  --ivory:#F6F5EC;
  --paper:#EFEDE3; --surface:#FFFFFF; --surface2:#F7F6EF; --surface3:#EDEBE0;
  --ink:#0E1440; --ink2:#4A517C; --muted:#8B90AC;
  --line:#DCD8C8; --line2:#E9E6DA;
  --ok:#227A4E; --ok-soft:#DCF0E5; --bad:#C43D42; --bad-soft:#FBE3E4;
  --warn:#9A6B10; --warn-soft:#FBEFD0;
  --st-idea:#2540D8; --st-guion:#7B4FD8; --st-filmacion:#0F8E8A; --st-edicion:#C4327A;
  --st-copy:#B8860B; --st-programado:#7A5C33; --st-entregado:#227A4E;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:8px; --r-sm:6px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:inherit}
i{font-style:normal}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--lime);color:var(--navy)}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.nowrap{white-space:nowrap}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums}

/* ───── shell ───── */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--navy);color:var(--ivory);border-bottom:3px solid var(--lime)}
.top .sep{width:1px;height:22px;background:var(--navy3)}
.top .eyebrow{font-size:10.5px;letter-spacing:.14em;color:#9CA2C4;font-weight:600}
.top .who{margin-left:auto;display:flex;align-items:center;gap:12px}
.top .who .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.top .who .rl{font-size:10.5px;color:#9CA2C4}
.top .btn{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.17)}
.avatar-top{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin:16px 9px 6px;font-weight:700}
.rail .grp:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left;color:var(--ink2);font-size:13.5px}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.nav svg{flex:none;opacity:.85}
.nav .badge{margin-left:auto}
.rail-foot{margin-top:auto;padding:12px 9px 2px;border-top:1px solid var(--line2)}

.main{overflow:auto;min-width:0;background:var(--paper)}
.page{padding:22px 26px 70px;max-width:1400px}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px}
.ph .desc{font-size:12.5px;color:var(--ink2);margin-top:3px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ───── controles ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:500;transition:background .13s,border-color .13s,box-shadow .13s;white-space:nowrap}
.btn:hover{border-color:var(--line-2,#C4BCA6);background:var(--surface2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d);box-shadow:0 4px 14px rgba(37,64,216,.28)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy);font-weight:700}
.btn.lime:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.tiny{padding:4px 9px;font-size:11.5px;gap:5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.ib{display:grid;place-items:center;width:30px;height:30px;padding:0;border-radius:var(--r-sm)}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:6px 13px;border:0;background:none;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(14,20,64,.09)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px solid var(--line2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--lime);color:var(--navy);font-size:10.5px;font-weight:700}
.badge.bad{background:var(--bad);color:#fff}

label.f{display:block;font-size:11.5px;color:var(--ink2);font-weight:500;margin-bottom:2px}
.input,select.input,textarea.input{display:block;width:100%;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px}
.input::placeholder{color:var(--muted)}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,64,216,.13)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
.hint{font-size:10.5px;color:var(--muted);margin-top:3px}
.error-text{font-size:11.5px;color:var(--bad)}

/* ───── superficies ───── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel + .panel{margin-top:14px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h h2{font-size:15px}
.panel-h .acts{margin-left:auto;display:flex;gap:7px}
.panel.dark{background:var(--navy);color:var(--ivory);border-color:var(--navy)}
.panel.dark .muted{color:#9CA2C4}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--blue))}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat .l{font-size:11.5px;color:var(--ink2);margin-top:5px}

/* ───── kanban ───── */
.kan{display:grid;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{min-width:0}
.kcol-h{display:flex;align-items:center;gap:7px;padding:0 2px 9px;margin-bottom:10px;border-bottom:2px solid var(--kc,var(--line))}
.kcol-h .t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.kcol-h .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.kcol-empty{font-size:11.5px;color:var(--muted);padding:10px 2px}

.tcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--kc,var(--line));border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:box-shadow .14s,transform .14s}
.tcard:hover{box-shadow:0 6px 18px rgba(14,20,64,.11);transform:translateY(-1px)}
.tcard .cl{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-bottom:4px}
.tcard .ti{font-size:13px;font-weight:600;line-height:1.32;margin-bottom:9px;letter-spacing:-.01em}
.tcard .meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink2)}
.tcard .dline{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-bottom:8px}

.prog{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.prog .tr{flex:1;height:4px;background:var(--surface3);border-radius:999px;overflow:hidden}
.prog .fl{height:100%;background:var(--blue);border-radius:999px}
.prog .fl.done{background:var(--ok)}
.prog .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

.av{width:23px;height:23px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}

/* ───── modal ───── */
.ov{position:fixed;inset:0;background:rgba(14,20,64,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.dlg{background:var(--surface);border-radius:12px;box-shadow:0 24px 64px rgba(14,20,64,.3);width:380px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:440px}
.dlg-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 13px;border-bottom:1px solid var(--line2)}
.dlg-h .eyebrow{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-weight:600;text-transform:uppercase}
.dlg-h h2{font-size:16px;margin-top:2px}
.dlg-b{padding:16px 18px;overflow-y:auto;flex:1}
.dlg-f{padding:13px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;background:var(--surface2)}
.dlg-f .btn{flex:1}
.sec{padding-top:15px;margin-top:15px;border-top:1px solid var(--line2)}
.sec:first-child{padding-top:0;margin-top:0;border-top:0}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sec-t .k{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:700}

/* ───── comentarios ───── */
.cmts{display:flex;flex-direction:column;gap:8px;max-height:170px;overflow-y:auto;margin-bottom:10px}
.cmt{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px}
.cmt .w{font-size:10px;color:var(--muted);margin-bottom:3px}
.cmt .x{font-size:12.5px}
.cmt-form{display:flex;gap:7px}

/* ───── calendario ───── */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h .m{font-size:16px;font-weight:700;letter-spacing:-.02em}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow div{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d{min-height:86px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 7px;cursor:pointer;transition:border-color .13s}
.cal-d:hover{border-color:var(--blue-line)}
.cal-d.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal-d.on{background:var(--blue-soft);border-color:var(--blue)}
.cal-d .dn{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.cal-d.today .dn{color:var(--blue)}
.ev{font-size:9.5px;border-radius:3px;padding:2px 5px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.ev.video{background:var(--surface3);color:var(--ink2)}
.ev.plazo{background:var(--bad-soft);color:var(--bad)}
.ev.libre{background:var(--blue-soft);color:var(--blue)}
.cal-more{font-size:9px;color:var(--muted)}

/* ───── tabla ───── */
.lst{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.lrow .t{font-size:13px;font-weight:600}
.lrow .s{font-size:11px;color:var(--muted);margin-top:2px}
.lrow .acts{margin-left:auto;display:flex;gap:6px}

/* ───── pendientes ───── */
.pend{display:flex;flex-direction:column;gap:2px}
.pend-i{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent}
.pend-i:hover{background:var(--surface2);border-color:var(--line2)}
.pend-i .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend-i .d{font-size:10.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.pend-empty{font-size:11.5px;color:var(--muted);padding:7px 8px}
.pend-x{flex:none;width:21px;height:21px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:5px;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .12s}
.pend-i:hover .pend-x{opacity:1}
.pend-x:hover{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

/* ───── tools ───── */
.tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tool{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-decoration:none;min-width:136px;flex:none;transition:border-color .13s,box-shadow .13s}
.tool:hover{border-color:var(--blue-line);box-shadow:0 3px 10px rgba(14,20,64,.07)}
.tool .n{font-size:12.5px;font-weight:600}
.tool .d{font-size:10.5px;color:var(--muted)}

/* ───── conexión ───── */
.conn{position:fixed;bottom:14px;right:16px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--ink2);box-shadow:0 2px 10px rgba(14,20,64,.1)}
.conn .dot{width:7px;height:7px;border-radius:999px;background:var(--muted);flex:none}


/* ───── intro ───── */
#splash{position:fixed;inset:0;z-index:999;background:#2540D8;display:grid;place-items:center;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(78vw,620px);height:auto;display:block}
@media(prefers-reduced-motion:reduce){#splash{display:none}}

/* ───── login ───── */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-brand{background:var(--navy);color:var(--ivory);padding:50px 54px;display:flex;flex-direction:column;justify-content:center;gap:30px;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-130px;bottom:-130px;width:360px;height:360px;border-radius:999px;background:var(--blue);opacity:.34}
.login-brand > *{position:relative;z-index:1}
.login-claim{font-size:42px;font-weight:800;line-height:1.03;letter-spacing:-.045em}
.login-foot{font-size:11.5px;color:#9CA2C4;letter-spacing:.03em}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:312px}
.login-card h1{font-size:21px;margin-bottom:3px}
.nav .sm{display:none}
.nav.only-m{display:none}
.mas-item{justify-content:flex-start;text-align:left;padding:14px 16px;margin-bottom:10px;gap:14px}
.mas-item span{display:block}
.mas-item small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
@media(max-width:820px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:36px 28px;gap:20px}
  .login-claim{font-size:30px}
  /* Estructura: barra superior + contenido; el menú pasa a una barra fija abajo */
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100vh;height:100dvh}
  .top{grid-column:1;padding:0 12px;gap:10px}
  .top .sep,.top .eyebrow,.top .who .rl{display:none}
  .top .who{gap:8px}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:55;flex-direction:row;align-items:stretch;gap:0;overflow:visible;
    padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(14,20,64,.08)}
  .rail .grp,.rail-foot{display:none}
  .nav,.nav.only-m{display:flex;flex:1 1 0;min-width:0;width:auto;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:7px 0;font-size:9.5px;letter-spacing:-.01em;text-align:center;position:relative;border-radius:8px}
  .nav.no-m{display:none}
  .nav .lg{display:none}
  .nav .sm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .grow{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav.on{box-shadow:none}
  .nav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:16px;height:16px;font-size:9.5px;padding:0 4px}
  .main{-webkit-overflow-scrolling:touch}
  .page{padding:16px 14px calc(90px + env(safe-area-inset-bottom))}
  .conn{bottom:calc(72px + env(safe-area-inset-bottom));right:10px}
  .ph h1{font-size:20px}
  .ph .acts{margin-left:0;width:100%}
  .ph .acts .btn{flex:1}
  /* Tablero: las etapas se deslizan de lado, una a la vez */
  .kan{grid-template-columns:none !important;grid-auto-flow:column;grid-auto-columns:82vw;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px 8px;scroll-padding-left:14px}
  .kcol{scroll-snap-align:start}
  /* Ventanas emergentes a lo ancho de la pantalla */
  .ov{padding:10px}
  .dlg,.dlg.wide{width:100% !important;max-width:460px;max-height:92vh;max-height:92dvh}
  /* 16px evita que el iPhone haga zoom automático al tocar un campo */
  .input,select.input,textarea.input{font-size:16px}
  .pend-page .pend-i .x{white-space:normal}
  /* Calendario: 7 columnas iguales que no se ensanchan por el texto de los eventos */
  .cal-dow,.cal-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal-d{min-height:64px;padding:4px 3px;min-width:0;overflow:hidden}
  .cal-d .dn{font-size:10.5px;margin-bottom:2px}
  .cal-d > div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-dow div{font-size:9px;letter-spacing:0}
  /* Formularios: dos columnas que no se salen de la ventana */
  .row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row2 > *,.field{min-width:0}
  input[type=date],input[type=time]{min-width:0;max-width:100%}
}
